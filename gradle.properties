# ==========================================
# 1. 核心内存与进程控制 (针对 14GB 可用内存极致调优)
# ==========================================
# Gradle 守护进程：限制最大 3G，起步 512M，用 ParallelGC 榨干 5500GT 多核
org.gradle.jvmargs=-XX:+UseParallelGC -Xmx3072m -Xms512m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin 守护进程：1.5G 在 CI 冷编译 :app:compileAppReleaseKotlin 写产物阶段会 GC overhead limit exceeded，放宽到 4G
kotlin.daemon.jvmargs=-XX:+UseParallelGC -Xmx4096m -Xms512m -Dfile.encoding=UTF-8

# 极度关键：编译测完立刻杀死进程，释放所有内存给 AI 编辑器和系统
org.gradle.daemon=false

# ==========================================
# 2. 编译加速与缓存配置 (白嫖 CPU 性能)
# ==========================================
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true

# 开启配置缓存 (强烈推荐改为 true，大幅缩减 AI 频繁修改代码后的二次测试时间)
org.gradle.unsafe.configuration-cache=true

# ==========================================
# 3. Android 官方与第三方库标准配置
# ==========================================
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official

# 开启 RClass 命名空间隔离，减少 R 文件大小，能省一点编译内存是一点
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# ==========================================
# 4. 项目及测试专属注入参数 (保留你原有的配置)
# ==========================================
CronetVersion=128.0.6613.40
CronetMainVersion=128.0.0.0
android.injected.testOnly=false
android.injected.androidTest.leaveApksInstalledAfterRun=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.r8.strictFullModeForKeepRules=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
